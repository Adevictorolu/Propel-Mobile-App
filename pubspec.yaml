name: propel
description: "Propel Mentorship Platform - Production Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing (Provider architecture)
  provider: ^6.1.2
  go_router: ^13.2.0

  # Backend & Networking (Firebase Architecture)
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  dio: ^5.4.1

  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Design & UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  lottie: ^3.1.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
